---
name: Push branch workflow (BAH fork)

# BAH fork of awslabs/aws-athena-query-federation. This workflow only fires on
# our own branches; upstream branches/tags do not exist in our fork.
#
# The workflow builds the athena-docdb connector image, pushes it to our private
# ECR repo (athena-prod-mongo-connector-v2 in eu-central-1), and tags it after
# the branch name. Deployment is done out-of-band via terragrunt apply in the
# infra repo (see infra/athena-federated-query.md §10).

env:
  ecr_repo: athena-prod-mongo-connector-v2
  aws_region: eu-central-1

on:
  push:
    branches:
      - "bah-fork"
      - "feature/**"

jobs:
  build_and_push:
    name: Build connector image and push to ECR
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Maven build (athena-docdb only)
        run: mvn -B -DskipTests -pl athena-docdb -am clean install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Tag = branch name (slashes replaced with dashes), prefixed bah-fork-
          # so e.g. "feature/foo-bar" becomes "bah-fork-feature-foo-bar".
          RAW="${GITHUB_REF##*/}"
          if [[ "$GITHUB_REF_NAME" == "bah-fork" ]]; then
            TAG="bah-fork-latest"
          else
            TAG="bah-fork-${RAW//\//-}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # --provenance=false + --sbom=false: AWS Lambda's CreateFunction
          # rejects the multi-arch/attestation OCI manifest that buildx
          # produces by default.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --push \
            -t "${ECR_REGISTRY}/${{ env.ecr_repo }}:${TAG}" \
            athena-docdb

      - name: Summary
        run: |
          echo "::notice::Pushed ${{ steps.login-ecr.outputs.registry }}/${{ env.ecr_repo }}:${{ steps.image.outputs.tag }}"
          echo "::notice::To deploy: bump image_tag in infra/.../lambda-mongo/terragrunt.hcl and terragrunt apply."
