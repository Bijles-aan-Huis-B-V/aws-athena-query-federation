---
name: Push tag workflow (BAH fork)

# Releases of the BAH fork are tagged bah-fork-vN (e.g. bah-fork-v1, bah-fork-v2).
# This workflow builds and pushes both the version-specific tag and `bah-fork-latest`
# to the ECR repo. Bumping the deployed image is a manual terragrunt apply step.

env:
  ecr_repo: athena-prod-mongo-connector-v2
  aws_region: eu-central-1

on:
  push:
    tags:
      - "bah-fork-v*"

jobs:
  build_and_push:
    name: Build connector image and push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Maven build (athena-docdb only)
        run: mvn -B -DskipTests -pl athena-docdb -am clean install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push version + latest to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --push \
            -t "${ECR_REGISTRY}/${{ env.ecr_repo }}:${TAG}" \
            -t "${ECR_REGISTRY}/${{ env.ecr_repo }}:bah-fork-latest" \
            athena-docdb

      - name: Summary
        run: |
          echo "::notice::Pushed ${{ steps.login-ecr.outputs.registry }}/${{ env.ecr_repo }}:${{ github.ref_name }}"
          echo "::notice::Also tagged as bah-fork-latest."
          echo "::notice::To deploy: set image_tag = \"${{ github.ref_name }}\" in infra/.../lambda-mongo/terragrunt.hcl and terragrunt apply."
